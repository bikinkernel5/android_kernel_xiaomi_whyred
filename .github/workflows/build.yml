name: Build Whyred Kernel with GCC and Pack ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex git make \
          libssl-dev libelf-dev libncurses-dev ccache \
          gcc-aarch64-linux-gnu zip

    - name: Cleanup flags from all sources
      run: |
        find . -type f -name "*Makefile*" -exec sed -i \
          -e 's/-Werror//g' \
          -e 's/-implicit-function-declaration//g' \
          {} \;

    - name: Patch Makefile for warnings
      run: |
        echo 'KBUILD_CFLAGS := $(filter-out -Werror,$(KBUILD_CFLAGS))' >> Makefile

    - name: Build Kernel with GCC
      run: |
        mkdir -p out
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        make O=out whyred_defconfig
        make -j$(nproc) O=out \
          HOSTCC=aarch64-linux-gnu-gcc HOSTCXX=aarch64-linux-gnu-g++ \
          CC=aarch64-linux-gnu-gcc LD=ld

    - name: Upload Image.gz-dtb
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb
        path: out/arch/arm64/boot/Image.gz-dtb

    - name: Package flashable ZIP
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        rm -rf AnyKernel3/.git
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        sed -i 's/^device.name1=.*/device.name1=whyred/' AnyKernel3/anykernel.sh
        sed -i 's/^supported.versions=.*/supported.versions=13/' AnyKernel3/anykernel.sh
        cd AnyKernel3
        zip -r9 ../whyred_kernel_flashable.zip ./*

    - name: Upload flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: whyred_kernel_flashable.zip
        path: whyred_kernel_flashable.zip
