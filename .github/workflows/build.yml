name: Build Panda Kernel Whyred

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Compile Panda Kernel
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex git libssl-dev \
            libncurses-dev lzop ccache libelf-dev libtfm-dev python-is-python3

      - name: Set compiler PATH
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV

      - name: Compile kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          make O=out whyred_defconfig
          make -j$(nproc) O=out

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb
          path: out/arch/arm64/boot/Image.gz-dtb
