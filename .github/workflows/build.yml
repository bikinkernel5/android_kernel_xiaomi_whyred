name: Build Whyred Kernel and Pack to Flashable ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y bc bison flex git make \
          libssl-dev libelf-dev libncurses-dev ccache \
          gcc-aarch64-linux-gnu clang lld zip

    - name: Cleanup all bad flags early
      run: |
        find . -type f -name "*Makefile*" -exec sed -i \
          -e 's/-Werror//g' \
          -e 's/-implicit-function-declaration//g' \
          -e 's/-Wno-error=frame-larger-than=/ -Wno-error=frame-larger-than/g' \
          -e 's/=-unknown-warning-option//g' \
          {} \;

    - name: Patch main Makefile
      run: |
        echo 'KBUILD_CFLAGS += -Wno-error=frame-larger-than' >> Makefile

    - name: Show Kbuild includes (debug)
      run: |
        grep -R "frame-larger-than" -n .

    - name: Build kernel with verbose logs
      run: |
        mkdir -p out
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make O=out whyred_defconfig
        make -j$(nproc) O=out HOSTCC=clang HOSTCXX=clang++ CC=clang LD=ld.lld V=1

    - name: Upload Image.gz-dtb
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb
        path: out/arch/arm64/boot/Image.gz-dtb

    - name: Package flashable zip
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        rm -rf AnyKernel3/.git
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        sed -i 's/^device.name1=.*/device.name1=whyred/' AnyKernel3/anykernel.sh
        sed -i 's/^supported.versions=.*/supported.versions=13/' AnyKernel3/anykernel.sh
        cd AnyKernel3
        zip -r9 ../whyred_kernel_flashable.zip ./*

    - name: Upload flashable zip
      uses: actions/upload-artifact@v4
      with:
        name: whyred_kernel_flashable.zip
        path: whyred_kernel_flashable.zip
