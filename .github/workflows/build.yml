name: Build Kernel for Whyred Panda

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Compile Panda Kernel & Generate Clean Defconfig

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex git make \
          libssl-dev libelf-dev libncurses-dev ccache \
          gcc-aarch64-linux-gnu clang lld

    - name: Configure environment variables
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV

    - name: Locate and copy your defconfig
      run: |
        mkdir -p arch/arm64/configs/

        if [ -f defconfig ]; then
          cp defconfig arch/arm64/configs/defconfig
          echo "✅ defconfig ditemukan di root repo."
        elif [ -f configs/defconfig ]; then
          cp configs/defconfig arch/arm64/configs/defconfig
          echo "✅ defconfig ditemukan di folder configs/."
        else
          echo "❌ defconfig tidak ditemukan. Harap letakkan di root atau folder configs/."
          exit 1
        fi

    - name: Generate .config and savedefconfig
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        export LD=ld.lld

        mkdir -p out
        make O=out defconfig
        make O=out olddefconfig
        make O=out savedefconfig

    - name: Upload whyred_defconfig
      uses: actions/upload-artifact@v4
      with:
        name: whyred_defconfig
        path: out/defconfig
