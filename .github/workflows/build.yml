name: Build Kernel for Whyred Panda

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Compile Kernel for Panda

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y clang bc bison build-essential curl flex git \
            libssl-dev libncurses-dev lzop ccache libelf-dev libtfm-dev \
            python-is-python3 ca-certificates xz-utils

      - name: Compile the kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=
          make O=out defconfig
          make -j$(nproc) O=out

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb
          path: out/arch/arm64/boot/Image.gz-dtb
