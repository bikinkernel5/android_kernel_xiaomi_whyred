name: Build Kernel for Whyred Panda

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Compile Kernel for Panda Kernel
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up build environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex git libssl-dev \
            libncurses-dev lzop ccache libelf-dev libtfm-dev python-is-python3 \
            ca-certificates xz-utils

      - name: Download and extract clang toolchain
        run: |
          mkdir clang
          curl -LO https://github.com/Neutron-Toolchains/clang-builds/releases/download/Neutron-17/Neutron-CLANG-17.0.2.tar.gz
          tar -xvzf Neutron-CLANG-17.0.2.tar.gz -C clang --strip-components=1

      - name: Compile the kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$PWD/clang/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-

          make O=out defconfig
          make -j$(nproc) O=out

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb
          path: out/arch/arm64/boot/Image.gz-dtb
