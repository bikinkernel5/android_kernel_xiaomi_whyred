name: Build Kernel for Whyred Panda

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Compile Panda Kernel

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex git make \
          libssl-dev libelf-dev libncurses-dev ccache \
          gcc-aarch64-linux-gnu clang lld

    - name: Configure build variables
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV

    - name: Compile kernel
      run: |
        make O=out defconfig
        make -j$(nproc) O=out \
          CC=clang \
          LD=ld.lld

    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb
        path: out/arch/arm64/boot/Image.gz-dtb
