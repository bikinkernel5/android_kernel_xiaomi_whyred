name: Build Panda Kernel Whyred

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Compile Panda Kernel
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex git libssl-dev \
            libncurses-dev lzop ccache libelf-dev libtfm-dev python-is-python3

      - name: Download Neutron Clang
        run: |
          mkdir clang
          curl -LO https://github.com/Neutron-Toolchains/clang-builds/releases/download/20230826/Neutron-LLVM-17.0.0.tar.gz
          tar -xf Neutron-LLVM-17.0.0.tar.gz -C clang --strip-components=1

      - name: Compile kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$PWD/clang/bin:$PATH
          export KBUILD_COMPILER_STRING="Neutron Clang 17.0.0"

          make O=out whyred_defconfig
          make -j$(nproc) O=out

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb
          path: out/arch/arm64/boot/Image.gz-dtb
